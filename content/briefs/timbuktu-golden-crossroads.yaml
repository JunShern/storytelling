event: >
  Timbuktu in the era of Mansa Musa: the trans-Saharan salt-and-gold trade,
  camel caravans from Taghaza, Mansa Musa's famous pilgrimage to Mecca,
  the building of Djinguereber mosque, and the beginnings of the city's
  great tradition of books and learning.
